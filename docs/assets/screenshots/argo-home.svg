<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1020" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
  <title id="title">Argo terminal home screen</title>
  <desc id="desc">The Argo logo and startup coding CLI picker with Claude Code selected.</desc>
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82e6ff"/>
      <stop offset="1" stop-color="#3782eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#05070d" flood-opacity=".6"/>
    </filter>
  </defs>

  <rect width="1400" height="1020" fill="#0b0f19"/>
  <circle cx="150" cy="80" r="300" fill="#123b59" opacity=".18"/>
  <circle cx="1260" cy="910" r="360" fill="#24225c" opacity=".18"/>

  <g filter="url(#shadow)">
    <rect x="70" y="54" width="1260" height="912" rx="18" fill="#171d29" stroke="#313b50"/>
    <path d="M88 54h1224a18 18 0 0 1 18 18v42H70V72a18 18 0 0 1 18-18z" fill="#222a39"/>
    <circle cx="103" cy="84" r="8" fill="#ff6b6b"/>
    <circle cx="130" cy="84" r="8" fill="#ffd166"/>
    <circle cx="157" cy="84" r="8" fill="#5ed69b"/>
    <text x="700" y="91" fill="#8e9bb2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">argo · ~/project</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="700" y="322" fill="url(#logo)" text-anchor="middle"
          font-family="Arial Black, Helvetica Neue, sans-serif" font-size="174"
          font-weight="900" letter-spacing="14">ARGO</text>

    <text x="700" y="432" fill="#647087" text-anchor="middle" font-size="18">─── ✦ ───</text>
    <text x="700" y="469" fill="#a0aabc" text-anchor="middle" font-size="20">choose your coding CLI · v0.1.0</text>

    <rect x="122" y="512" width="1156" height="47" rx="6" fill="#263247"/>
    <text x="145" y="543" fill="#66ccff" font-size="20" font-weight="700">choose a coding CLI — Enter once · Space choose + save default · type to filter</text>

    <rect x="122" y="574" width="1156" height="45" rx="5" fill="#91d8db"/>
    <text x="145" y="604" fill="#173647" font-size="22" font-weight="700">Claude Code</text>
    <text x="420" y="604" fill="#294a59" font-size="19">model presets · native resume · Argo MCP delegation</text>

    <g fill="#e4e9f1" font-size="21">
      <text x="145" y="651">Codex CLI</text>
      <text x="420" y="651" fill="#aab4c5" font-size="19">model presets · native resume · Argo MCP delegation</text>
      <text x="145" y="693">OpenCode</text>
      <text x="420" y="693" fill="#aab4c5" font-size="19">model presets · native resume · Argo command delegation</text>
      <text x="145" y="735">Kiro CLI</text>
      <text x="420" y="735" fill="#aab4c5" font-size="19">live models · native resume · Argo MCP delegation</text>
      <text x="145" y="777">Command Code</text>
      <text x="420" y="777" fill="#aab4c5" font-size="19">live models · native resume · Argo command delegation</text>
      <text x="145" y="819">Antigravity</text>
      <text x="420" y="819" fill="#aab4c5" font-size="19">live models · native resume · Argo command delegation</text>
      <text x="145" y="861">Grok CLI</text>
      <text x="420" y="861" fill="#aab4c5" font-size="19">live models · context replay · Argo command delegation</text>
    </g>

    <text x="1255" y="929" fill="#667187" text-anchor="end" font-size="16">↑↓ move · Esc close</text>
  </g>
</svg>
