[workspace]
resolver = "2"
members = [
    "crates/argo-core",
    "crates/argo-context",
    "crates/argo-store",
    "crates/argo-runtime",
    "crates/argo-daemon",
    "crates/argo-resources",
    "crates/argo-tui",
    "crates/argo-cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/MaticAlgos/argo"

[workspace.dependencies]
# Internal crates
argo-core = { path = "crates/argo-core" }
argo-store = { path = "crates/argo-store" }
argo-context = { path = "crates/argo-context" }
argo-runtime = { path = "crates/argo-runtime" }
argo-resources = { path = "crates/argo-resources" }
argo-daemon = { path = "crates/argo-daemon" }
argo-tui = { path = "crates/argo-tui" }

# External. Minor-pinned; Cargo.lock provides exact reproducible pins.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
    "net",
    "fs",
    "signal",
    "io-std",
] }
tokio-util = { version = "0.7", features = ["codec"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
sha2 = "0.10"
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
pulldown-cmark = "=0.12.2"
anyhow = "1.0"
libc = "0.2"
tempfile = "3.12"
walkdir = "2.5"
futures = "0.3"
shlex = "1.3"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
